name: "Spelling"

on:  # yamllint disable-line rule:truthy
    pull_request: null
    push:
        branches:
        - "master"

jobs:
    typos:
        name: "Typos"
        runs-on: "ubuntu-24.04"
        steps:
        -
            name: "Check out repository"
            uses: "actions/checkout@v7"
        -
            name: "Search for misspellings"
            uses: "crate-ci/typos@v1.49.0"
